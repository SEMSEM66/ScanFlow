name: Build iOS IPA & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Sideloadable iOS IPA
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: 5. Prebuild Native iOS Project
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/

      - name: 6. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          ls -la
          cd ..

      - name: 7. Build Release Archive with Xcode
        run: |
          # Dynamically locate the .xcworkspace
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Using workspace: $WORKSPACE"
          
          # List all schemes
          xcodebuild -workspace "$WORKSPACE" -list
          
          # Detect scheme name (fallback to ScanFlow or scanflow)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | grep -o '"ScanFlow"' | head -n 1 | tr -d '"' || echo "")
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | grep -o '"scanflow"' | head -n 1 | tr -d '"' || echo "ScanFlow")
          fi
          echo "Using scheme: $SCHEME"
          
          # Compile unsigned/ad-hoc release archive
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScanFlow.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 8. Package into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ScanFlow.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          echo "Packaging application: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ScanFlow.ipa Payload
          cd ..
          ls -lh build/ScanFlow.ipa

      - name: 9. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-ipa
          path: build/ScanFlow.ipa

      - name: 10. Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ScanFlow v1.1.0
          body: |
            ## 📄 ScanFlow v1.1.0 — iOS Sideloadable Release
            
            This is the standalone **ScanFlow.ipa** build ready for sideloading on physical iPhones.
            
            ### 📱 Sideloading Instructions:
            1. Download `ScanFlow.ipa` below.
            2. Connect your iPhone to your PC via USB.
            3. Open **Sideloadly** (or **AltStore** / **TrollStore** / **Scarlet**).
            4. Drag and drop `ScanFlow.ipa` into Sideloadly, enter your Apple ID, and click **Start**.
            5. On your iPhone, go to **Settings > General > VPN & Device Management** and trust your Developer App certificate.
            6. Open ScanFlow and enjoy!
          draft: false
          prerelease: false
          files: build/ScanFlow.ipa
