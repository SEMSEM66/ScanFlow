name: Build iOS IPA & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Sideloadable iOS IPA
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: 5. Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 6. Build Release Archive with Xcode
        run: |
          xcodebuild archive \
            -workspace ios/ScanFlow.xcworkspace \
            -scheme ScanFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScanFlow.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 7. Package into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ScanFlow.xcarchive/Products/Applications/ScanFlow.app build/Payload/
          cd build
          zip -r ScanFlow.ipa Payload
          cd ..
          ls -lh build/ScanFlow.ipa

      - name: 8. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-ipa
          path: build/ScanFlow.ipa

      - name: 9. Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ScanFlow v1.1.0
          body: |
            ## 📄 ScanFlow v1.1.0 — iOS Sideloadable Release
            
            This is the standalone **ScanFlow.ipa** build ready for sideloading on physical iPhones.
            
            ### 📱 Sideloading Instructions:
            1. Download `ScanFlow.ipa` below.
            2. Connect your iPhone to your PC via USB.
            3. Open **Sideloadly** (or **AltStore** / **TrollStore** / **Scarlet**).
            4. Drag and drop `ScanFlow.ipa` into Sideloadly, enter your Apple ID, and click **Start**.
            5. On your iPhone, go to **Settings > General > VPN & Device Management** and trust your Developer App certificate.
            6. Open ScanFlow and enjoy!
          draft: false
          prerelease: false
          files: build/ScanFlow.ipa
