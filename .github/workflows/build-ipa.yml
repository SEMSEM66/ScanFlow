name: Build iOS IPA & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Sideloadable iOS IPA
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure Xcode Environment
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode*
          
          # Automatically select newest Xcode (preferring Xcode 26.x which bundles Swift 6.2+)
          TARGET_XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$TARGET_XCODE" ]; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$TARGET_XCODE" ]; then
            TARGET_XCODE="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE"
          xcodebuild -version
          swift --version
          
          # Run first launch setup to register device platforms
          sudo xcodebuild -runFirstLaunch
          
          # Ensure iOS platform runtime is installed
          sudo xcodebuild -downloadPlatform iOS || true

      - name: 3. Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every app version gets its own GitHub release: tag v<version> from
      # package.json (or the pushed v* tag). Pushing again without a version
      # bump updates that version's release with the new IPA.
      - name: 4. Read App Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::warning::package.json ($VERSION) and app.json ($APP_VERSION) have different versions - using package.json."
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: ScanFlow $TAG"

      - name: 5. Install Dependencies & Apply Patches
        run: |
          npm install
          node scripts/patch-expo-modules-jsi.js

      - name: 6. Prebuild iOS Project
        env:
          EXPO_DEBUG: "1"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/

      - name: 7. Verify CocoaPods Dependencies
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          if [ ! -d "ios/Pods" ]; then
            echo "Pods directory missing, running pod install..."
            cd ios
            pod install --repo-update
            cd ..
          else
            echo "CocoaPods dependencies already installed successfully."
          fi
          ls -la ios/

      - name: 8. Build Release App with Xcode
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/!"
            ls -la ios/
            exit 1
          fi
          echo "Using workspace: $WORKSPACE"
          
          # Show schemes and destinations
          xcodebuild -workspace "$WORKSPACE" -scheme "ScanFlow" -showdestinations
          
          # Compile Release ARM64 binary with code-signing disabled
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "ScanFlow" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: 9. Package into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching entire build directory for .app..."
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr ScanFlow.ipa Payload
          cd ..
          ls -lh build/ScanFlow.ipa

      - name: 10. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-${{ steps.version.outputs.tag }}-ipa
          path: build/ScanFlow.ipa
          if-no-files-found: error

      - name: 11. Write Release Notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # "What's new" = the section "## [<version>]" of CHANGELOG.md
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^---[[:space:]]*$/ { next }
            found && /^### / { print "#" $0; next }
            found { print }
          ' CHANGELOG.md > build/changes.md
          if ! grep -q '[^[:space:]]' build/changes.md; then
            echo "No CHANGELOG.md entry for $VERSION." > build/changes.md
          fi
          {
            echo "## 📄 ScanFlow $TAG — iOS Sideloadable Release"
            echo ""
            echo "Standalone **ScanFlow.ipa** build for sideloading on physical iPhones (built from commit ${GITHUB_SHA:0:7})."
            echo ""
            echo "### 📱 Sideloading Instructions:"
            echo "1. Download \`ScanFlow.ipa\` below."
            echo "2. Connect your iPhone to your PC via USB."
            echo "3. Open **Sideloadly** (or **AltStore** / **TrollStore** / **Scarlet**)."
            echo "4. Drag and drop \`ScanFlow.ipa\` into Sideloadly, enter your Apple ID, and click **Start**."
            echo "5. On your iPhone, go to **Settings > General > VPN & Device Management** and trust your Developer App certificate."
            echo "6. Open ScanFlow and enjoy!"
            echo ""
            echo "### 📝 What's new in $VERSION"
            cat build/changes.md
          } > build/release-notes.md
          cat build/release-notes.md

      - name: 12. Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ScanFlow ${{ steps.version.outputs.tag }}
          body_path: build/release-notes.md
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: build/ScanFlow.ipa
