name: Build iOS IPA & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Sideloadable iOS IPA
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure Xcode Environment
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode*
          
          # Default to the primary pre-configured Xcode on macos-15 (Xcode 16.x)
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          
          # Run first launch setup to register device platforms
          sudo xcodebuild -runFirstLaunch
          
          # Ensure iOS platform runtime is installed
          sudo xcodebuild -downloadPlatform iOS || true

      - name: 3. Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Prebuild iOS Project
        env:
          EXPO_DEBUG: "1"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/

      - name: 6. Verify CocoaPods Dependencies
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          if [ ! -d "ios/Pods" ]; then
            echo "Pods directory missing, running pod install..."
            cd ios
            pod install --repo-update
            cd ..
          else
            echo "CocoaPods dependencies already installed successfully."
          fi
          ls -la ios/

      - name: 7. Build Release App with Xcode
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/!"
            ls -la ios/
            exit 1
          fi
          echo "Using workspace: $WORKSPACE"
          
          # Show schemes and destinations
          xcodebuild -workspace "$WORKSPACE" -scheme "ScanFlow" -showdestinations
          
          # Compile Release ARM64 binary with code-signing disabled
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "ScanFlow" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: 8. Package into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching entire build directory for .app..."
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr ScanFlow.ipa Payload
          cd ..
          ls -lh build/ScanFlow.ipa

      - name: 9. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-ipa
          path: build/ScanFlow.ipa
          if-no-files-found: error

      - name: 10. Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.1.0
          name: ScanFlow v1.1.0
          body: |
            ## 📄 ScanFlow v1.1.0 — iOS Sideloadable Release
            
            This is the standalone **ScanFlow.ipa** build ready for sideloading on physical iPhones.
            
            ### 📱 Sideloading Instructions:
            1. Download `ScanFlow.ipa` below.
            2. Connect your iPhone to your PC via USB.
            3. Open **Sideloadly** (or **AltStore** / **TrollStore** / **Scarlet**).
            4. Drag and drop `ScanFlow.ipa` into Sideloadly, enter your Apple ID, and click **Start**.
            5. On your iPhone, go to **Settings > General > VPN & Device Management** and trust your Developer App certificate.
            6. Open ScanFlow and enjoy!
          draft: false
          prerelease: false
          files: build/ScanFlow.ipa
